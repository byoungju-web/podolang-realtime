name = "podolang-realtime"
main = "src/worker.js"
compatibility_date = "2026-04-23"

# ⚠️ API 키는 절대 여기에 쓰지 마세요.
#    이 파일은 GitHub 에 그대로 올라갑니다. 키를 여기 넣으면 공개됩니다.
#    OPENAI_API_KEY / TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN /
#    TWILIO_PHONE_NUMBER / ELEVENLABS_API_KEY 는
#    Cloudflare 대시보드 → Settings → Variables and Secrets 에서
#    Secret 으로 넣으세요. (전화번호만 Text 로 넣어도 됩니다)

[[durable_objects.bindings]]
name = "CALL"
class_name = "CallSession"

# 무료 플랜에서는 SQLite 백엔드 Durable Object 만 만들 수 있습니다.
# new_classes 로 쓰면 무료 플랜에서 배포가 실패합니다.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallSession"]
