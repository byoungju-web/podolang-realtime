name = "podolang-realtime"
main = "src/worker.js"
compatibility_date = "2026-04-23"

# ⚠️ [vars] 는 이 파일에 딱 한 번만 씁니다.
#    두 번 쓰면 뒤엣것만 남고 앞엣것이 통째로 사라져 배포가 깨집니다.
[vars]
TWILIO_PHONE_NUMBER = "+14472841160"
TALK_API = "https://podotalk-api.hasin7jk.workers.dev"

# LINK_KEY 를 여기 둡니다.
# 대시보드에 Secret 으로 넣으면 GitHub 배포 때마다 지워져서, 크레딧 확인이
# 계속 끊겼습니다. 서버끼리 서로를 알아보는 문일 뿐이라 여기 두어도 됩니다.
# ★ 세 워커가 모두 같은 값이어야 합니다.
LINK_KEY = "podo-link-9f3a2b7c1d8e5415"

# ⚠️ 아래 값들은 절대 여기에 쓰지 마세요. 진짜 비밀입니다.
#    OPENAI_API_KEY / TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / ADMIN_KEY
#    → Cloudflare 대시보드에서 Secret 으로 넣으세요.

# 통화 번호를 잠깐 적어두는 저장소
[[kv_namespaces]]
binding = "LIC"
id = "23323b6ef380479295654318149de40f"

[[durable_objects.bindings]]
name = "CALL"
class_name = "CallSession"

# 무료 플랜은 SQLite 백엔드 Durable Object 만 만들 수 있습니다.
# new_classes 로 쓰면 배포가 실패합니다.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallSession"]

# 포도톡 워커를 직접 부르는 길입니다.
# 같은 계정의 워커를 workers.dev 주소로 부르면 Cloudflare 가 막습니다
# (error code 1042). 이 연결을 쓰면 주소를 거치지 않아 막히지 않습니다.
[[services]]
binding = "TALK"
service = "podotalk-api"
